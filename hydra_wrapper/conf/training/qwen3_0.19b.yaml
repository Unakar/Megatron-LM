# Qwen3 ~0.19B Training Configuration (CBS experiments)

# Batch sizes (overridden per sweep)
micro_batch_size: 4
global_batch_size: 256

# Safety cap for CBS experiments (target-val-loss stops training earlier)
train_iters: 50000

# Logging intervals
log_interval: 10
save_interval: 500
eval_interval: 50
eval_iters: 25
hidden_state_log_interval: 10000

# Regularization
clip_grad: 1.0

# Precision
precision: bf16

# Misc
no_masked_softmax_fusion: true

# Checkpointing
ckpt_format: torch_dist
async_save: true
no_save_optim: false

# Detailed logging
log_params_norm: true
log_throughput: true
log_num_zeros_in_grad: true
log_validation_ppl_to_tensorboard: true
log_timers_to_tensorboard: true
log_memory_to_tensorboard: true
log_world_size_to_tensorboard: true
log_per_module_update_rms: true
log_per_module_grad_rms: true

