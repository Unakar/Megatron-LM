# OLMo-Mix 100B/1B preprocessed data configuration
use_mock: false

# Data paths (without _text_document.bin suffix - Megatron adds this)
# Format: "weight path [weight path ...]" for blended datasets
# Using separate train/val splits:
train_data_path: /n/netscratch/kempner_barak_lab/Lab/nabreu/olmo100b_megatron/olmo_train_100b_text_document
valid_data_path: /n/netscratch/kempner_barak_lab/Lab/nabreu/olmo100b_megatron/olmo_val_1b_text_document

# Tokenizer settings - must match what was used during preprocessing
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: allenai/OLMo-2-1124-7B

# Data split - ignored when using separate train/valid paths
# Format: "train,valid,test"
split: "100,0,0"
